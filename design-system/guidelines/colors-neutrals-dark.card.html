<!-- @dsCard group="Colors" viewport="700x190" name="Neutrals — dark (default)" subtitle="The theme the product actually ships in." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div class="sw">
<div class="s"><div class="chip" style="background:#0b1120"></div><div class="n">bg-body</div><div class="v">#0b1120</div></div>
<div class="s"><div class="chip" style="background:#131c31"></div><div class="n">bg-surface</div><div class="v">#131c31</div></div>
<div class="s"><div class="chip" style="background:#1a2744"></div><div class="n">surface-hover</div><div class="v">#1a2744</div></div>
<div class="s"><div class="chip" style="background:#182236"></div><div class="n">bg-elevated</div><div class="v">#182236</div></div>
<div class="s"><div class="chip" style="background:#080e1e"></div><div class="n">bg-nav-solid</div><div class="v">#080e1e</div></div>
<div class="s"><div class="chip" style="background:#1e3050"></div><div class="n">border</div><div class="v">#1e3050</div></div>
<div class="s"><div class="chip" style="background:#e2e8f0"></div><div class="n">text-primary</div><div class="v">#e2e8f0</div></div>
<div class="s"><div class="chip" style="background:#94a3b8"></div><div class="n">text-secondary</div><div class="v">#94a3b8</div></div>
<div class="s"><div class="chip" style="background:#64748b"></div><div class="n">text-tertiary</div><div class="v">#64748b</div></div>
</div>
</body>
</html>
