<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:20px">
<img src="../assets/logo.svg" alt="StudySession Pro" style="width:88px;height:88px;border-radius:19px">
<img src="../assets/logo.svg" alt="" style="width:48px;height:48px;border-radius:10px">
<img src="../assets/logo.svg" alt="" style="width:28px;height:28px;border-radius:6px">
<div style="display:flex;align-items:center;gap:10px;margin-left:8px">
<span style="font-size:1.5rem;font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">StudySession Pro</span>
</div>
</div>
</body>
</html>
