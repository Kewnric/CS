<!-- @dsCard group="Effects" viewport="700x170" name="Glow & glass" subtitle="Coloured glow marks anything active or hovered; glass is 80% surface at 12px blur." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(6,182,212,.07) 50%,rgba(16,185,129,.05));padding:14px;border-radius:var(--radius-xl)">
<div style="width:130px;height:64px;border-radius:var(--radius-lg);background:linear-gradient(135deg,#6366f1,#4f46e5);box-shadow:0 4px 16px rgba(99,102,241,.25);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:#fff">button glow</div>
<div style="width:130px;height:64px;border-radius:var(--radius-lg);background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px">glass tile</div>
<div style="width:130px;height:64px;border-radius:var(--radius-lg);background:rgba(19,28,49,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.05);box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px">analytics panel</div>
<div style="width:60px;height:64px;border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:0 0 20px rgba(99,102,241,.25);border:1px solid var(--color-primary)"></div>
</div>
</body>
</html>
