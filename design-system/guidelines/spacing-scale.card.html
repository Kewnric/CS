<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="Six steps on a 4px base. Component padding often uses raw rem instead." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:4px;height:4px;background:var(--color-primary);border-radius:3px"></div><div class="n">xs</div><div class="v">4px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:8px;height:8px;background:var(--color-primary);border-radius:3px"></div><div class="n">sm</div><div class="v">8px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:16px;height:16px;background:var(--color-primary);border-radius:3px"></div><div class="n">md</div><div class="v">16px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:24px;height:24px;background:var(--color-primary);border-radius:3px"></div><div class="n">lg</div><div class="v">24px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:32px;height:32px;background:var(--color-primary);border-radius:3px"></div><div class="n">xl</div><div class="v">32px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:48px;height:48px;background:var(--color-primary);border-radius:3px"></div><div class="n">2xl</div><div class="v">48px</div></div>
</div>
</body>
</html>
