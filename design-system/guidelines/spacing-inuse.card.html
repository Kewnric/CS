<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing in use" subtitle="A dashboard row: 20px page gap, 14px between tiles, 20/24px card padding." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:1.25rem">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.875rem">
<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:1.25rem 1rem;text-align:center"><div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:800">87</div><div style="font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)">Solved</div></div><div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:1.25rem 1rem;text-align:center"><div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:800">87</div><div style="font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)">Solved</div></div><div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:1.25rem 1rem;text-align:center"><div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:800">87</div><div style="font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)">Solved</div></div>
</div>
<div style="background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-xl);padding:1.25rem 1.5rem"><div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary)">Recent activity</div></div>
</div>
</body>
</html>
