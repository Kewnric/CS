<!-- @dsCard group="Type" viewport="700x150" name="Uppercase eyebrows" subtitle="The app labels almost everything with these instead of headings." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary)">Recent activity · form label · card header</div>
<div style="font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary)">Folder summary — 800 weight</div>
<div style="font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.22em;color:var(--text-tertiary)">Carousel title — 0.22em</div>
</div>
</body>
</html>
