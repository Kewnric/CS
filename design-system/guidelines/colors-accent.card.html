<!-- @dsCard group="Colors" viewport="700x150" name="Accent — cyan" subtitle="Active states, folder glyphs, file tabs. Never a button fill." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div class="sw">
<div class="s"><div class="chip" style="background:#06b6d4"></div><div class="n">accent</div><div class="v">#06b6d4</div></div>
<div class="s"><div class="chip" style="background:#22d3ee"></div><div class="n">accent-hover</div><div class="v">#22d3ee</div></div>
<div class="s"><div class="chip" style="background:linear-gradient(90deg,#22d3ee,rgba(34,211,238,0.15))"></div><div class="n">active rail</div><div class="v">#22d3ee + glow</div></div>
<div class="s"><div class="chip" style="background:rgba(6,182,212,0.08)"></div><div class="n">tab wash</div><div class="v">8% cyan</div></div>
<div class="s"><div class="chip" style="background:linear-gradient(135deg,#6366f1,#22d3ee)"></div><div class="n">brand gradient</div><div class="v">indigo→cyan</div></div>
</div>
</body>
</html>
