<!-- @dsCard group="Colors" viewport="700x190" name="Neutrals — light" subtitle="The :root default. Same tokens, inverted values." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div class="sw">
<div class="s"><div class="chip" style="background:#f8fafc"></div><div class="n">bg-body</div><div class="v">#f8fafc</div></div>
<div class="s"><div class="chip" style="background:#ffffff"></div><div class="n">bg-surface</div><div class="v">#ffffff</div></div>
<div class="s"><div class="chip" style="background:#f1f5f9"></div><div class="n">surface-hover</div><div class="v">#f1f5f9</div></div>
<div class="s"><div class="chip" style="background:#e2e8f0"></div><div class="n">border</div><div class="v">#e2e8f0</div></div>
<div class="s"><div class="chip" style="background:#0f172a"></div><div class="n">text-primary</div><div class="v">#0f172a</div></div>
<div class="s"><div class="chip" style="background:#475569"></div><div class="n">text-secondary</div><div class="v">#475569</div></div>
<div class="s"><div class="chip" style="background:#94a3b8"></div><div class="n">text-tertiary</div><div class="v">#94a3b8</div></div>
</div>
</body>
</html>
