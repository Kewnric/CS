<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:8px;max-width:300px">
<div style="position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;border-radius:var(--radius-md);font-weight:600;font-size:.95rem;background:radial-gradient(circle at left,rgba(34,211,238,.15) 0%,transparent 80%),linear-gradient(135deg,#080e1e,#111827);color:#fff"><span style="position:absolute;left:0;top:15%;bottom:15%;width:3px;background:#22d3ee;box-shadow:2px 0 8px #22d3ee;border-radius:0 4px 4px 0"></span>Home</div><div style="position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;border-radius:var(--radius-md);font-weight:600;font-size:.95rem;background:transparent;color:#94a3b8">Library</div><div style="position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;border-radius:var(--radius-md);font-weight:600;font-size:.95rem;background:transparent;color:#94a3b8">Analytics</div>
</div>
</body>
</html>
