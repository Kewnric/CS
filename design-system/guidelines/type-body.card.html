<!-- @dsCard group="Type" viewport="700x190" name="Body & UI" subtitle="14px is the real body size — buttons, inputs, table cells all sit here." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:9px">
<div class="rowline"><div class="lbl">15 / 600</div><div style="font-size:.9375rem;font-weight:600">Tree label, list item title</div></div>
<div class="rowline"><div class="lbl">14 / 400</div><div style="font-size:.875rem">Body copy, table cells, input text — the app's default size.</div></div>
<div class="rowline"><div class="lbl">14 / 600</div><div style="font-size:.875rem;font-weight:600">Button label</div></div>
<div class="rowline"><div class="lbl">12 / 600</div><div style="font-size:.75rem;font-weight:600">Tag, meta line, description</div></div>
<div class="rowline"><div class="lbl">11 / 700</div><div style="font-size:.6875rem;font-weight:700">Badge, form label, card eyebrow</div></div>
</div>
</body>
</html>
