<!-- @dsCard group="Colors" viewport="700x170" name="Theme scopes" subtitle="Four themes, cycled from Settings. Dark is default; purple and green also reassign --color-primary." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="min-width:56px">light</div><div style="display:flex;flex:1;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.06)"><div style="flex:2;background:#f8fafc"></div><div style="flex:2;background:#ffffff"></div><div style="flex:1;background:#6366f1"></div><div style="flex:1;background:#0f172a"></div></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="min-width:56px">dark</div><div style="display:flex;flex:1;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.06)"><div style="flex:2;background:#0b1120"></div><div style="flex:2;background:#131c31"></div><div style="flex:1;background:#6366f1"></div><div style="flex:1;background:#e2e8f0"></div></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="min-width:56px">purple</div><div style="display:flex;flex:1;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.06)"><div style="flex:2;background:#1e1b4b"></div><div style="flex:2;background:#312e81"></div><div style="flex:1;background:#a855f7"></div><div style="flex:1;background:#e0e7ff"></div></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="min-width:56px">green</div><div style="display:flex;flex:1;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.06)"><div style="flex:2;background:#064e3b"></div><div style="flex:2;background:#065f46"></div><div style="flex:1;background:#10b981"></div><div style="flex:1;background:#ecfdf5"></div></div></div>
</div>
</body>
</html>
