<!-- @dsCard group="Colors" viewport="700x150" name="Terminal" subtitle="Run-code and editor panes stay this dark in every theme." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div class="sw">
<div class="s"><div class="chip" style="background:#0d1117"></div><div class="n">term-bg</div><div class="v">#0d1117</div></div>
<div class="s"><div class="chip" style="background:#161b22"></div><div class="n">term-surface</div><div class="v">#161b22</div></div>
<div class="s"><div class="chip" style="background:#30363d"></div><div class="n">term-border</div><div class="v">#30363d</div></div>
<div class="s"><div class="chip" style="background:#e6edf3"></div><div class="n">term-text</div><div class="v">#e6edf3</div></div>
<div class="s"><div class="chip" style="background:#8b949e"></div><div class="n">term-muted</div><div class="v">#8b949e</div></div>
</div>
</body>
</html>
