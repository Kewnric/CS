<!-- @dsCard group="Spacing" viewport="700x150" name="Radius scale" subtitle="Nothing is square. Panes and modals are 24px." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;gap:14px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:48px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:6px"></div><div class="n">sm · 6px</div><div class="v">tags</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:48px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:10px"></div><div class="n">md · 10px</div><div class="v">buttons, inputs</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:48px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:16px"></div><div class="n">lg · 16px</div><div class="v">cards</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:48px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:24px"></div><div class="n">xl · 24px</div><div class="v">panes, modals</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:48px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:9999px"></div><div class="n">full · 9999px</div><div class="v">pills</div></div>
</div>
</body>
</html>
