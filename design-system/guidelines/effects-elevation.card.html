<!-- @dsCard group="Effects" viewport="700x160" name="Elevation" subtitle="Four neutral steps. Cards also carry an inset white hairline along the top." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html{background:var(--bg-body)}body{padding:16px;font-family:var(--font-sans);color:var(--text-primary);font-size:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;gap:6px;min-width:88px}
.chip{height:44px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}
.n{font-size:10px;font-weight:700;letter-spacing:.02em}
.v{font-size:9px;font-family:var(--font-mono);color:var(--text-tertiary)}
.rowline{display:flex;align-items:baseline;gap:14px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:96px}
</style>
</head>
<body>
<div style="display:flex;gap:16px">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div class="n">shadow-sm</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><div class="n">shadow-md</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div class="n">shadow-lg</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><div class="n">shadow-xl</div></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:110px;height:64px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:inset 0 1px 1px rgba(255,255,255,.08),var(--shadow-sm)"></div><div class="n">+ inset hairline</div></div>
</div>
</body>
</html>
