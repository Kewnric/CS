<div id="root"></div>
<script type="text/babel">
const { Toast, Skeleton, ProgressRing, Button, EmptyState } = window.StudySessionProDesignSystem_f5d02b;
function Demo(){return (

      <div><Skeleton variant="block" /><Skeleton width="70%" /><Skeleton width="45%" /></div>

  </div>);}
